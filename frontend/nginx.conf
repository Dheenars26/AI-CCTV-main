server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Static Web UI Assets (Vite hashed bundles)
    location ~* \.(?:css|js|woff2?|webp|png|jpe?g|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # WebSockets Stream Forwarding
    location /ws/ {
        proxy_pass http://backend-api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # API Routes Forwarding
    location /api/ {
        proxy_pass http://backend-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health Check Endpoint
    location /healthz {
        proxy_pass http://backend-api:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # OpenAPI Schema (Buffered to prevent 502 connection resets)
    location /openapi.json {
        proxy_pass http://backend-api:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    # Interactive Documentation Routes
    location /docs {
        proxy_pass http://backend-api:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend-api:8000/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend Single Page Application Router
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
