<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SynterionX - Enterprise Real-Time AI CCTV Surveillance, Fire & Smoke Detection, and Safety Operations Platform." />
    <title>SynterionX | Smart AI Surveillance & Safety Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
    </noscript>
    <style>
      /* Critical Inline CSS for instant 0ms Paint */
      body { background-color: #f8fafc; color: #0f172a; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
      #root-skeleton { min-height: 100vh; display: flex; flex-direction: column; background: #f8fafc; }
      #skeleton-nav { height: 64px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #ffffff; }
      #skeleton-brand { font-size: 16px; font-weight: 800; color: #2563eb; letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; }
      #skeleton-main { flex: 1; padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; }
      #skeleton-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
      .skeleton-card { height: 96px; background: rgba(15,23,42,0.5); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; }
    </style>
  </head>
  <body class="bg-[#080B11] text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white min-h-screen overflow-x-hidden">
    <div id="root">
      <div id="root-skeleton">
        <div id="skeleton-nav">
          <div id="skeleton-brand">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: #00f2fe; display: inline-block;"></span>
            AI CCTV MONITOR
          </div>
          <div style="font-size: 12px; color: #64748b; font-family: monospace;">INITIALIZING SOC GATEWAY...</div>
        </div>
        <div id="skeleton-main">
          <div id="skeleton-cards">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
