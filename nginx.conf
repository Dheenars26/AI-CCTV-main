# Enterprise NGINX Reverse Proxy Configuration
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Enterprise Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript application/xml image/svg+xml;

    # Frontend Dashboard Reverse Proxy
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API Reverse Proxy
    location /api/v1/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend-api:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Real-Time Endpoint Reverse Proxy
    location /api/v1/ws {
        proxy_pass http://backend-api:8000/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health & Readiness Probes
    location /healthz {
        proxy_pass http://backend-api:8000/healthz;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://backend-api:8000/readyz;
        proxy_set_header Host $host;
    }

    # API Documentation & OpenAPI Schema
    location = /openapi.json {
        proxy_pass http://backend-api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://backend-api:8000/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend-api:8000/redoc;
        proxy_set_header Host $host;
    }

    # Evidence Media Streaming (Unbuffered for large video files)
    location /api/v1/evidence/ {
        proxy_pass http://backend-api:8000/api/v1/evidence/;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus Metrics (Internal Network Access Only)
    location /metrics {
        proxy_pass http://backend-api:8000/metrics;
    }
}

# --- Optional HTTPS / TLS 1.3 Server (When certificates are mounted) ---
